<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden p-4" id="modal-register">
<div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl relative">
<button class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold" onclick="tutupModalRegister()">×</button>
<div class="text-center mb-6">
<h3 class="text-2xl font-bold text-white">Daftar Akun BimbelKu</h3>
<p class="text-xs text-slate-400 mt-1">Buat username dan password baru kamu</p>
</div>
<form class="space-y-4" onsubmit="prosesRegister(event)">
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">Username Baru</label>
<input class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition" id="register-username" placeholder="Buat username" required="" type="text"/>
</div>
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
<input class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition" id="register-password" placeholder="Buat password" required="" type="password"/>
</div>
<p class="text-xs text-rose-500 font-medium hidden text-center mt-2" id="register-error"></p>
<button class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition text-sm shadow-lg shadow-emerald-600/30" type="submit">
          Daftar Sekarang
        </button>
</form>
<div class="text-center mt-4 border-t border-slate-700/60 pt-4">
<p class="text-xs text-slate-400">
          Sudah punya akun? 
          <button class="text-emerald-400 font-semibold hover:underline" onclick="pindahKeLogin()">Login di sini</button>
</p>
</div>
</div>
</div>
