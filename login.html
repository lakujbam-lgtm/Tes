<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden p-4" id="modal-login">
<div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl relative">
<button class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold" onclick="tutupModalLogin()">×</button>
<div class="text-center mb-6">
<h3 class="text-2xl font-bold text-white">Login BimbelKu</h3>
<p class="text-xs text-slate-400 mt-1">Silakan masuk untuk mengakses materi terproteksi</p>
</div>
<form class="space-y-4" onsubmit="prosesLogin(event)">
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
<input class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-sky-500 transition" id="login-username" placeholder="Masukkan username" required="" type="text"/>
</div>
<div>
<label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
<input class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-sky-500 transition" id="login-password" placeholder="Masukkan password" required="" type="password"/>
</div>
<p class="text-xs text-rose-500 font-medium hidden text-center mt-2" id="login-error"></p>
<button class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl transition text-sm shadow-lg shadow-sky-600/30" type="submit">
          Masuk
        </button>
</form>
<!-- MENU DAFTAR / PENGALIHAN KE REGISTER -->
<div class="text-center mt-4 border-t border-slate-700/60 pt-4">
<p class="text-xs text-slate-400">
          Belum punya akun? 
          <button class="text-sky-400 font-semibold hover:underline" onclick="pindahKeRegister()">Daftar sekarang</button>
</p>
</div>
</div>
</div>
