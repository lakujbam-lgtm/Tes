<header class="sticky top-0 z-50 w-full backdrop-blur border-b border-slate-800 bg-slate-900/90">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between relative">
<!-- Logo BimbelKu -->
<button class="flex items-center gap-2 font-bold text-xl text-sky-500 focus:outline-none" onclick="bukaTab('tab-home')">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
<path d="M6 12v5c3 3 9 3 12 0v-5"></path>
</svg>
<span>Bimbel<span class="text-white">Ku</span></span>
</button>
<!-- Tombol Garis Tiga / Hamburger Menu -->
<button class="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg focus:outline-none transition" id="btn-hamburger" onclick="toggleMenu()">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Dropdown Menu -->
<div class="hidden absolute top-16 right-4 w-56 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-2 flex flex-col gap-1 z-50" id="mobile-menu">
<button class="w-full text-left px-4 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-sky-600 hover:text-white transition flex items-center gap-2" onclick="bukaTab('tab-home'); toggleMenu();">
          🏠 Beranda
        </button>
<button class="w-full text-left px-4 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-sky-600 hover:text-white transition flex items-center gap-2" onclick="bukaTab('tab-fundamental'); toggleMenu();">
          📚 Fundamental <span class="icon-kunci">🔒</span>
</button>
<button class="w-full text-left px-4 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-sky-600 hover:text-white transition flex items-center gap-2" onclick="bukaTab('tab-subtes'); toggleMenu();">
          🎯 Subtes UTBK <span class="icon-kunci">🔒</span>
</button>
<button class="w-full text-left px-4 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-sky-600 hover:text-white transition flex items-center gap-2" onclick="bukaTab('tab-tryout'); toggleMenu();">
          📝 Tryout
        </button>
<div class="border-t border-slate-700 my-1"></div>
<button class="w-full text-left px-4 py-2.5 rounded-lg text-sm text-sky-400 font-semibold hover:bg-sky-600 hover:text-white transition flex items-center gap-2" id="btn-login-menu" onclick="bukaModalLogin(); toggleMenu();">
          🔑 Login
        </button>
<button class="w-full text-left px-4 py-2.5 rounded-lg text-sm text-emerald-400 font-semibold hover:bg-emerald-600 hover:text-white transition flex items-center gap-2" id="btn-register-menu" onclick="bukaModalRegister(); toggleMenu();">
          📝 Daftar
        </button>
<button class="hidden w-full text-left px-4 py-2.5 rounded-lg text-sm text-rose-400 font-semibold hover:bg-rose-600 hover:text-white transition flex items-center gap-2" id="btn-logout-menu" onclick="logout(); toggleMenu();">
          🚪 Logout
        </button>
</div>
</div>
</header>
